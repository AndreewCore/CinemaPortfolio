backend:
  name: github
  repo: USUARIO/EJPortafolio # TODO: repo real en GitHub
  branch: main
  base_url: https://DOMINIO # TODO: dominio del sitio en Cloudflare Pages
  auth_endpoint: api/auth

# Con `pnpm cms` corriendo, /admin edita los archivos locales sin login.
local_backend: true

locale: es
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: home
    label: Inicio
    files:
      - name: collage
        label: Collage
        file: src/data/collage.json
        format: json
        fields:
          - label: Imágenes de producciones
            name: images
            widget: list
            field: { label: Imagen, name: image, widget: image }
      - name: about
        label: Sobre mí
        file: src/data/about.json
        format: json
        fields:
          - { label: Foto, name: photo, widget: image }
          - { label: Bio, name: bio, widget: text }
          - { label: Bio en inglés, name: bio_en, widget: text, required: false }

  - name: events
    label: Eventos
    label_singular: Evento
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Título en inglés, name: title_en, widget: string, required: false }
      - { label: Fecha, name: date, widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD" }
      - label: Fotos
        name: photos
        widget: list
        field: { label: Foto, name: photo, widget: image }

  - name: videos
    label: Filmmaking
    label_singular: Trabajo
    folder: src/content/videos
    create: true
    slug: "{{slug}}"
    sortable_fields: [position, order, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Título en inglés, name: title_en, widget: string, required: false }
      - label: Posición
        name: position
        widget: select
        # Mantener igual a `filmmakingRoles` en src/data/site.ts.
        options: [Dirección, Producción, Postproducción, Dirección de Fotografía]
      - { label: YouTube (enlace o ID), name: youtube, widget: string, required: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Orden, name: order, widget: number, value_type: int, default: 0 }

  - name: makeup
    label: Maquillaje
    label_singular: Look
    folder: src/content/makeup
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Título en inglés, name: title_en, widget: string, required: false }
      - label: Fotos
        name: photos
        widget: list
        field: { label: Foto, name: photo, widget: image }
      - { label: Orden, name: order, widget: number, value_type: int, default: 0 }

  - name: design
    label: Diseño Gráfico
    label_singular: Pieza
    folder: src/content/design
    create: true
    slug: "{{slug}}"
    sortable_fields: [type, order, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Título en inglés, name: title_en, widget: string, required: false }
      # Mantener igual a `designTypes` en src/data/site.ts.
      - { label: Tipo, name: type, widget: select, options: [Carrusel, Reel, Pieza] }
      - label: Imágenes (carrusel, pieza o portada del reel)
        name: images
        widget: list
        required: false
        field: { label: Imagen, name: image, widget: image }
      - { label: Video del reel (mp4), name: video, widget: file, required: false }
      - { label: YouTube Shorts (enlace o ID), name: youtube, widget: string, required: false }
      - { label: Orden, name: order, widget: number, value_type: int, default: 0 }
